<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2DAA" />
      <stop offset="50%" stop-color="#8B35FF" />
      <stop offset="100%" stop-color="#20CFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Obsidian Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0E0E16" stroke="url(#neonGrad)" stroke-width="2.5" />
  
  <!-- Sound Wave / Swaara Stylized Bars -->
  <g filter="url(#glow)">
    <rect x="26" y="38" width="5" height="24" rx="2.5" fill="url(#neonGrad)" />
    <rect x="35" y="28" width="5" height="44" rx="2.5" fill="url(#neonGrad)" />
    <rect x="44" y="20" width="5" height="60" rx="2.5" fill="url(#neonGrad)" />
    <rect x="53" y="30" width="5" height="40" rx="2.5" fill="url(#neonGrad)" />
    <rect x="62" y="24" width="5" height="52" rx="2.5" fill="url(#neonGrad)" />
    <rect x="71" y="40" width="5" height="20" rx="2.5" fill="url(#neonGrad)" />
  </g>
</svg>
